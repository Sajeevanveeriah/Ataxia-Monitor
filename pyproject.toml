[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "vw-mtc1-simulation"
version = "0.1.0"
description = "Waveform analysis and LTspice tooling for the VW-MTC1 controller"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=6,<8", "build>=1.2,<2"]

[tool.setuptools]
packages = ["vw_mtc1"]
package-dir = {vw_mtc1 = "VW-MTC1/Simulation/tools"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["vw_mtc1"]

[tool.coverage.report]
show_missing = true
