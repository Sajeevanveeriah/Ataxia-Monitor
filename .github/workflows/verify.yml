name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation-tools:
    name: Python tools (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m build --no-isolation
      - name: Install the built wheel
        shell: bash
        run: python -m pip install --no-deps dist/*.whl
      - run: python -m pytest -q --cov=vw_mtc1 --cov-report=term-missing
      - run: python scripts/check_project.py
      - if: runner.os == 'Linux'
        run: g++ -std=c++17 -Wall -Wextra -Werror -fsyntax-only tests/pinmap_compile.cpp
      - name: Compile and run the portable touch decoder tests
        if: runner.os == 'Linux'
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror tests/touch_decoder_test.cpp -o build/touch_decoder_tests
          build/touch_decoder_tests

  android:
    name: Android build, JVM tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon --console=plain
